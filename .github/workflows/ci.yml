name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'

  web-api-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run lint
      - run: npm run verify
      - name: AI rules eval (no API key required)
        run: npm run eval:ai
      - name: Build Next.js (without prod secrets)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://dukaanos.vercel.app
        run: npx next build
      - name: Secrets audit on client bundle
        run: |
          if grep -rnE "SUPABASE_SERVICE_ROLE_KEY|ED25519_PRIVATE_KEY|GEMINI_API_KEY|AIzaSy" .next/static; then
            echo "::error::Server secret or key leaked into .next/static client bundle!"
            exit 1
          fi
      - run: npm audit --omit=dev --audit-level=high

  mobile-verify:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: AI rules eval (no API key required)
        run: npm run eval:ai
